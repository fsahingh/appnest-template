<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>appnest</title>
  <meta name="description" content="appnest — a private home for apps.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0d17">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2300d4ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M18 40l14-8 14 8-14 8z' fill='white' opacity='.95'/%3E%3Cpath d='M18 30l14-8 14 8-14 8z' fill='white' opacity='.6'/%3E%3Cpath d='M18 20l14-8 14 8-14 8z' fill='white' opacity='.3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d17;
      --text: #f4f5fb;
      --muted: #a3a8c3;
      --violet: #7c5cff;
      --cyan: #00d4ff;
      --border: rgba(255, 255, 255, 0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* subtle animated background */
    .bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
    .blob { position: absolute; border-radius: 50%; filter: blur(100px); animation: drift 26s ease-in-out infinite alternate; }
    .b1 { width: 42vmax; height: 42vmax; background: var(--violet); opacity: .38; top: -20vmax; left: -14vmax; }
    .b2 { width: 36vmax; height: 36vmax; background: var(--cyan); opacity: .24; bottom: -18vmax; right: -12vmax; animation-duration: 32s; animation-delay: -8s; }
    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(5vmax, 6vmax) scale(1.1); }
    }
    .grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at center, #000 25%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 25%, transparent 70%);
    }

    .wrap {
      position: relative; z-index: 1; min-height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 16px; text-align: center;
    }

    .logo { width: 84px; height: 84px; margin-bottom: 28px; animation: float 4s ease-in-out infinite; filter: drop-shadow(0 18px 40px rgba(124,92,255,.45)); }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    h1 {
      font-size: clamp(2.4rem, 7vw, 3.6rem); font-weight: 800; letter-spacing: -.04em;
      opacity: 0; animation: rise .8s .1s ease-out forwards;
    }
    .lead {
      margin-top: 12px; font-size: 1.05rem; color: var(--muted);
      opacity: 0; animation: rise .8s .25s ease-out forwards;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .signin {
      margin-top: 40px; display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 30px; border-radius: 999px; text-decoration: none;
      font-size: 1rem; font-weight: 600; color: #fff;
      background: linear-gradient(135deg, var(--violet), #4f8cff 55%, var(--cyan));
      background-size: 200% 200%;
      box-shadow: 0 10px 30px rgba(124,92,255,.35);
      transition: transform .2s ease, box-shadow .2s ease, background-position .6s ease;
      opacity: 0; animation: rise .8s .4s ease-out forwards;
    }
    .signin:hover { transform: translateY(-2px); box-shadow: 0 14px 38px rgba(0,212,255,.35); background-position: 100% 50%; }
    .signin:focus-visible { outline: 2px solid var(--cyan); outline-offset: 4px; }
    .signin svg { width: 18px; height: 18px; transition: transform .2s ease; }
    .signin:hover svg { transform: translateX(3px); }

    .note {
      margin-top: 18px; font-size: .82rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px;
      opacity: 0; animation: rise .8s .55s ease-out forwards;
    }
    .note svg { width: 14px; height: 14px; stroke: var(--muted); }

    footer {
      position: absolute; bottom: 24px; left: 0; right: 0; z-index: 1;
      font-size: .78rem; color: var(--muted); text-align: center;
    }
    footer a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted rgba(163,168,195,.5); }
    footer a:hover { color: var(--text); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; animation-delay: 0s !important; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="grid"></div>
  </div>

  <main class="wrap">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#00d4ff"/></linearGradient></defs>
      <rect width="64" height="64" rx="16" fill="url(#lg)"/>
      <path d="M18 40l14-8 14 8-14 8z" fill="#fff" opacity=".95"/>
      <path d="M18 30l14-8 14 8-14 8z" fill="#fff" opacity=".6"/>
      <path d="M18 20l14-8 14 8-14 8z" fill="#fff" opacity=".3"/>
    </svg>
    <h1>appnest</h1>
    <p class="lead">A private home for apps.</p>

    <a class="signin" id="signin" href="https://apps.appnest.us/">
      Sign in
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
    <p class="note">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
      Access is by invitation only
    </p>
  </main>

  <footer>© <span id="y">2026</span> appnest · <a id="contact" href="#">Contact</a></footer>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();
    // Assemble the contact address at runtime so it isn't sitting in the HTML for scrapers
    document.getElementById("contact").href = "mailto:" + ["info", "appnest.us"].join("@");
  </script>
</body>
</html>
