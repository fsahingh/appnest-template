name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    # The template itself is not an app on the server (the panel and landing page are installed by
    # hand), so it skips the deploy; repos created from the template deploy as usual.
    if: github.repository != 'fsahingh/appnest-template'
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            # server folders and subdomains are lowercase even if the repo name is not (e.g. "KUT")
            cd "/opt/apps/$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
            git pull --ff-only
            docker compose up -d --build
            docker image prune -f
