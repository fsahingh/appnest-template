services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_PATH: /app/data/app.db
    # Only reachable from the server itself; nginx proxies <app>.appnest.us here.
    ports:
      - "127.0.0.1:${APP_PORT:-8001}:8000"
    volumes:
      - data:/app/data

volumes:
  data:
